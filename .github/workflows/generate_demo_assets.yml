name: Generate reproducible audio fixture
on:
  push:
    branches: [feature/report-formats-v0.3.0]
permissions:
  contents: read
jobs:
  demo:
    if: >-
      github.event.head_commit.message == 'chore: regenerate sample WAV and snapshots'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feature/report-formats-v0.3.0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install DSP dependencies
        run: python -m pip install -e .
      - name: Generate committed WAV and its actual JSON/Markdown/TXT evidence
        run: |
          python examples/generate_demo.py
          python examples/synthetic_demo.py > /dev/null
          sha256sum examples/assets/synthetic_spectral_comb.wav
      - name: Commit generated test assets and remove bootstrap workflow
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -f examples/assets/synthetic_spectral_comb.wav
          git add examples/results/
          git rm .github/workflows/generate_demo_assets.yml
          git commit -m 'testdata: commit generated WAV and verified reports'
          git push origin HEAD:feature/report-formats-v0.3.0
